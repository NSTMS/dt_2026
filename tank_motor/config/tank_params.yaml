    max_stepper_steps: 4096.0
    min_servo_angle: 30.0
    max_servo_angle: 120.0
    home_arm_angle: 75.0
    invert_servo: true
    reverse_stepper: false

keyboard_controller:
  ros__parameters:
    max_stepper_steps: 4096.0
    min_servo_angle: 30.0
    max_servo_angle: 120.0
    home_arm_angle: 75.0
    stepper_increment: 128.0
    servo_increment: 5.0
