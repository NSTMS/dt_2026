actuator_node:
  ros__parameters:
    step_delay_us: 2400.0
    use_half_step: true
    min_servo_angle: 0.0
    max_servo_angle: 180.0
    home_arm_angle: 90.0
    invert_servo: true
    reverse_stepper: false
    # Wygładzanie serwa MG995 (redukcja drgań na software PWM)
    servo_slew_deg_per_s: 120.0      # maks. prędkość ramienia [°/s] — mniej = gładziej
    servo_deadband_deg: 1.0          # ignoruj zmiany mniejsze niż [°]
    servo_settle_ms: 600.0           # czas dojazdu zanim PWM zostanie zwolnione [ms]
    servo_release_when_idle: true    # po dojeździe wyłącz PWM (ramię luzem, zero drgań)

keyboard_controller:
  ros__parameters:
    min_servo_angle: 0.0
    max_servo_angle: 180.0
    home_arm_angle: 90.0
    stepper_increment: 512.0
    stepper_hold_steps_per_tick: 64.0
    servo_increment: 5.0
    cmd_vel_rate_hz: 20.0

motor:
  ros__parameters:
    pwm_frequency_hz: 5000.0
    watchdog_timeout_sec: 0.8
    min_duty_percent: 15.0
